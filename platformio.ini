[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

lib_deps = 
  bblanchon/ArduinoJson
  tzapu/WiFiManager
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  openenergymonitor/EmonLib
  mathworks/ThingSpeak